; PlatformIO Project Configuration File
;
[platformio]
data_dir = data

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[env:M5AtomS3]
; pioarduino fork of the ESP32 platform (Arduino core 3.x). Pin the exact fork+tag
; so CI resolves the same platform that builds locally; plain "espressif32" from the
; registry is a different platform with Arduino core 2.x.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-s3-devkitc-1
lib_ldf_mode = deep
framework = arduino
upload_port = /dev/ttyACM0
upload_speed = 1500000
monitor_speed = 115200
monitor_port = /dev/ttyACM0
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
extra_scripts = pre:scripts/embed_web.py
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-Iinclude
; Exact versions: unpinned dependencies broke the build before (FastLED).
; M5GFX and ESPAsyncWebServer come from git tags, the registry no longer has these versions;
; M5GFX and AsyncTCP are listed before the libraries that depend on them, so the pinned
; versions satisfy those dependencies instead of pulling newer ones.
lib_deps =
	https://github.com/m5stack/M5GFX.git#0.2.19
	m5stack/M5Unified@0.2.13
	esp32async/AsyncTCP@3.4.10
	https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.6.0
	bblanchon/ArduinoJson@7.4.3

