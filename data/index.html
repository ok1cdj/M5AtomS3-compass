<!DOCTYPE html>
<html>
<head>
    <title>M5AtomS3 Compass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #33FF33; /* Terminal green */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #azimuth-container {
        }
        #azimuthValue {
            font-size: 25vmin;
            font-weight: bold;
            letter-spacing: 2px;
        }
        #degreeSymbol {
            font-size: 12vmin;
            vertical-align: super;
        }
        .imu-container {
            font-size: 8vmin;
            margin-top: 1vh;
        }
        .imu-degree-symbol {
            font-size: 4vmin;
            vertical-align: super;
        }
        #battery {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 5vmin;
        }
    </style>
</head>
<body>
    <a href="/settings" style="position: absolute; top: 20px; right: 20px; font-size: 8vmin; color: #33FF33; text-decoration: none;">&#9881;</a>
    <div id="battery"></div>
    <div id="container">
        <div id="azimuth-container">
            <span id="azimuthValue">...</span>
            <span id="degreeSymbol">&deg;</span>
        </div>
        <div id="elev-container" class="imu-container">
            Elev: <span id="elevValue">...</span><span class="imu-degree-symbol">&deg;</span>
        </div>
    </div>

    <script>
        var gateway = `ws://${window.location.hostname}/ws`;
        var websocket;

        function initWebSocket() {
            console.log('Trying to open a WebSocket connection...');
            websocket = new WebSocket(gateway);
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
        }

        function onOpen(event) {
            console.log('Connection opened');
        }

        function onClose(event) {
            console.log('Connection closed');
            setTimeout(initWebSocket, 2000);
        }

        function onMessage(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.azimuth === undefined) return; // settings message
                document.getElementById('azimuthValue').innerHTML = data.azimuth;
                document.getElementById('elevValue').innerHTML = data.elev;
                const battery = document.getElementById('battery');
                if (data.bat) {
                    battery.innerText = 'BAT ' + data.bat.p + '% ' + data.bat.v.toFixed(2) + 'V';
                    battery.style.color = data.bat.p <= 10 ? '#FF3333' : (data.bat.p <= 25 ? '#FFAA33' : '#33FF33');
                } else {
                    battery.innerText = '';
                }
            } catch (e) {
                console.error('Error parsing JSON:', e);
            }
        }

        window.addEventListener('load', initWebSocket);
    </script>
</body>
</html>
