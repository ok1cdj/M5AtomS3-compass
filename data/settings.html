<!DOCTYPE html>
<html>
<head>
    <title>M5AtomS3 Compass Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #33FF33; /* Terminal green */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
        }
        h1 {
            font-size: 10vmin;
        }
        .setting-container {
            font-size: 8vmin;
            margin-top: 2vh;
        }
        input, button {
            font-family: inherit;
            font-size: inherit;
            background-color: #1a1a1a;
            color: #33FF33;
            border: 1px solid #33FF33;
            text-align: center;
        }
        input {
            width: 4em;
        }
        button {
            background-color: #333;
        }
        a.back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 10vmin;
            color: #33FF33;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">&#8617;</a>

    <h1>Settings</h1>

    <div class="setting-container">
        Declination:
        <input type="number" id="declinationInput" value="5" min="-90" max="90">
        <button id="setDeclinationBtn">Set</button>
    </div>
    <div class="setting-container">
        <a href="/wifi" style="color: #33FF33;">WiFi networks</a>
    </div>
    <div class="setting-container" id="status" style="font-size: 4vmin; height: 4vmin;"></div>

    <script>
        var gateway = `ws://${window.location.hostname}/ws`;
        var websocket;

        function initWebSocket() {
            console.log('Trying to open a WebSocket connection...');
            websocket = new WebSocket(gateway);
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
        }

        function onOpen(event) {
            console.log('Connection opened');
        }

        function onClose(event) {
            console.log('Connection closed');
            setTimeout(initWebSocket, 2000);
        }

        function setDeclination() {
            const declinationValue = document.getElementById('declinationInput').value;
            console.log('Sending declination:', declinationValue);
            websocket.send('decl:' + declinationValue);
            document.getElementById('status').innerText = 'Declination set!';
            setTimeout(() => { document.getElementById('status').innerText = ''; }, 2000);
        }

        window.addEventListener('load', () => {
            initWebSocket();
            document.getElementById('setDeclinationBtn').addEventListener('click', setDeclination);
        });
    </script>
</body>
</html>
